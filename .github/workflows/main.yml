name: Run news bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: news-bot-run
  cancel-in-progress: true   # جلوگیری از اجرای هم‌زمان

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit sent links and titles
  if: success()
  run: |
    git config --global user.name "github-actions[bot]"
    git config --global user.email "github-actions[bot]@users.noreply.github.com"
    git add sent_links.txt sent_titles.txt
    if git diff --cached --quiet; then
      echo "No changes to commit"
    else
      git commit -m "Update sent links and titles"
      git push --force
    fi
